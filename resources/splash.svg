  <g transform="translate(1366 1366) scale(0.62) translate(-512 -512)">
    <circle cx="512" cy="512" r="272" fill="none" stroke="#38bdf8" stroke-width="64"/>
    <rect x="464" y="192" width="96" height="416" rx="48" fill="#cf6f2c"/>
    <circle cx="512" cy="688" r="128" fill="#cf6f2c"/>
    <circle cx="512" cy="688" r="56" fill="#0b1116"/>
  </g>
</svg>
