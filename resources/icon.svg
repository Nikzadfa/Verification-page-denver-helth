<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    App Store icon source.

    Full bleed and opaque: Apple applies the rounded mask itself and rejects an
    icon with an alpha channel, so there is no corner radius and no
    transparency here. The home-screen favicon (src/app/icon.svg) keeps its own
    rounding because nothing masks that one.
  -->
  <rect width="1024" height="1024" fill="#0b1116"/>
  <circle cx="512" cy="512" r="272" fill="none" stroke="#38bdf8" stroke-width="64"/>
  <rect x="464" y="192" width="96" height="416" rx="48" fill="#cf6f2c"/>
  <circle cx="512" cy="688" r="128" fill="#cf6f2c"/>
  <circle cx="512" cy="688" r="56" fill="#0b1116"/>
</svg>
